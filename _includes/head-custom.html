{% if page.url != '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ '/' | absolute_url }}" }
{%- if page.url contains '/books/' %},
    { "@type": "ListItem", "position": 2, "name": "Books", "item": "{{ '/books.html' | absolute_url }}" },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
{%- elsif page.url contains '/articles/' and page.url != '/articles/' %},
    { "@type": "ListItem", "position": 2, "name": "Research Articles", "item": "{{ '/articles/' | absolute_url }}" },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
{%- elsif page.url contains '/research/' and page.url != '/research/' %},
    { "@type": "ListItem", "position": 2, "name": "Research", "item": "{{ '/research/' | absolute_url }}" },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
{%- else %},
    { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }
{%- endif %}
  ]
}
</script>
{% endif %}
