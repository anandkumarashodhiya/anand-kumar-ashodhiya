<!-- ================= PAGE TITLES ================= -->
<title>{% if page.title %}{{ page.title }} | Anand Kumar Ashodhiya{% else %}Anand Kumar Ashodhiya | Official Research & Literary Hub{% endif %}</title>

<!-- ================= STRUCTURAL WEBSITE SCHEMA ================= -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Anand Kumar Ashodhiya",
  "alternateName": [
    "Kavi Anand Shahpur",
    "आनन्द कुमार आशोधिया"
  ],
  "url": "https://anandkumarashodhiya.github.io/anand-kumar-ashodhiya/",
  "image": "https://anandkumarashodhiya.github.io/anand-kumar-ashodhiya/anand-kumar-ashodhiya-profile-photo.jpg",
  "sameAs": [
    "https://orcid.org/0009-0005-1592-0592",
    "https://scholar.google.com/citations?user=mO9WCuIAAAAJ",
    "https://www.linkedin.com/in/anand-kumar-ashodhiya-599248285",
    "https://independent.academia.edu/AAshodhiya"
  ],
  "jobTitle": "Author, Poet, Independent Researcher"
}
</script>

<!-- ================= AUTOMATED SITE-WIDE LAZY LOADING ================= -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Automatically apply loading="lazy" to every image on the site
    var allImages = document.querySelectorAll("img");
    allImages.forEach(function(img) {
        // Skip the very first main profile photo so the top of the page loads instantly
        if (!img.src.includes("anand-kumar-ashodhiya-profile-photo.jpg")) {
            img.setAttribute("loading", "lazy");
        }
    });
});
</script>

<!-- ================= BASIC SEO ================= -->
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="author" content="Anand Kumar Ashodhiya">
<meta name="robots" content="index, follow">
