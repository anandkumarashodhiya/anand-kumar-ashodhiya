<!-- ================= BASIC SEO ================= -->
<title>{{ page.title }}{% if page.title %} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="author" content="Anand Kumar Ashodhiya">
<meta name="robots" content="index, follow">

<!-- ================= FAVICON ================= -->
<link rel="icon" href="{{ site.baseurl }}/favicon.png" type="image/png">
<link rel="shortcut icon" href="{{ site.baseurl }}/favicon.png">

<!-- ================= OPEN GRAPH (SOCIAL MEDIA) ================= -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="https://anandkumarashodhiya.github.io/anand-kumar-ashodhiya/og-image.jpg">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">

<!-- ================= TWITTER CARD ================= -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="https://anandkumarashodhiya.github.io/anand-kumar-ashodhiya/og-image.jpg">
