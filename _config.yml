theme: jekyll-theme-architect

title: Anand Kumar Ashodhiya
name: Anand Kumar Ashodhiya
generator: "Anand Kumar Ashodhiya Official Site"

description: "Official profile of Anand Kumar Ashodhiya – author, poet, and researcher specializing in Haryanvi Ragni, Pingal Shastra, and Indian folk literature."
tagline: Author, Poet, Researcher & Cultural Envoy

url: "https://anandkumarashodhiya.github.io"
baseurl: "/anand-kumar-ashodhiya"

show_downloads: false

# Ensures the theme doesn't inject default technical styles/text
kramdown:
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-sitemap

# Force the jekyll-sitemap plugin to output lastmod date tags
jekyll-sitemap:
  lastmod: true
  
include:
  - articles
  - articles/*.pdf
  - google36447f783b790ee1.html
  - _includes/head.html
  - _includes/head-custom.html

exclude:
  - LICENSE
